[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-zarr-benchmark"
version = "0.1.0"
description = "Latency benchmarks of TS-Zarr against EDF and NWB on local disk, HTTP, and S3"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "zarr==3.4.1",
    "numcodecs==0.17.1",
    "timeseries-zarr==0.1.0a12",
    "tsdownsample==0.1.5.1",
    "pynwb==4.2.0",
    "hdmf==6.2.0",
    "hdmf-zarr==0.14.0",
    "h5py==3.16.0",
    "hdf5plugin==7.1.0",
    "fsspec==2026.9.0",
    "s3fs==2026.9.0",
    "aiohttp==3.14.5",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "moto[server]==5.2.4",
    "pyedflib==0.1.42",
]
dev = [
    "ruff==0.17.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
include = ["tszbench*", "generate*", "upload*", "format_benchmark*", "resampling_benchmark*", "plot*", "smoke*"]

[tool.setuptools.package-data]
plot = ["prices.json"]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RET", "SIM", "PTH", "N", "D"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
disallow_untyped_calls = false
files = ["tszbench", "generate", "upload", "format_benchmark", "resampling_benchmark", "plot", "smoke", "envs"]

[[tool.mypy.overrides]]
module = [
    "fsspec", "fsspec.*", "s3fs", "s3fs.*", "pynwb", "pynwb.*", "hdmf", "hdmf.*",
    "hdmf_zarr", "hdmf_zarr.*", "h5py", "h5py.*", "hdf5plugin", "tsdownsample",
    "tsdownsample.*", "scipy", "scipy.*", "pandas", "pandas.*", "matplotlib",
    "matplotlib.*", "moto", "moto.*", "aiobotocore", "aiobotocore.*", "botocore",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: starts a local HTTP server or a local S3 server",
]
